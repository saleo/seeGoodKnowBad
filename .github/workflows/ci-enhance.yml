name: CI Enhancement & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci-enhance-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run CI Enhancement
        run: npm run ci:enhance
      
      - name: Lint code
        run: npm run lint
        continue-on-error: true
      
      - name: Build for WeChat Mini Program
        run: npm run build:mp-weixin
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

      - name: Setup WeChat private key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: echo "$WECHAT_PRIVATE_KEY" > ./private.wxba340bcd9707423f.key

      - name: Upload Mini Program to WeChat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          UPLOAD_PROJECT_PATH: dist/build/mp-weixin
        run: npm run upload
      
      - name: Commit changes (if auto-generated files changed)
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --cached --exit-code || (git commit -m "ci: auto-enhance CI configuration" && git push)
