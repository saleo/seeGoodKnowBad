name: Deploy Cloud Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'cloudfunctions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup private key
        run: |
          echo "${{ secrets.WX_PRIVATE_KEY }}" > ./private.wxba340bcd9707423f.key
      
      - name: Deploy cloud functions
        run: npm run deploy:cloudfunctions
